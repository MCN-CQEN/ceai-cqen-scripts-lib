name: GHAS - Security checks

on:
  pull_request:
  push:
    branches:
      - dev
      - main
  schedule:
    - cron: '34 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    if: ${{ vars.CODEQL_ENABLED == 'true' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: MCN-CQEN/ceai-cqen-scripts-lib/.github/workflows/ghas-codeql.yml@221333ee22916ac85d18c6d3c604d02339e9b6cd
    with:
      languages: '["actions", "python"]'

  dependency-review:
    if: ${{ github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true' }}
    uses: MCN-CQEN/ceai-cqen-scripts-lib/.github/workflows/ghas-dependency-review.yml@221333ee22916ac85d18c6d3c604d02339e9b6cd
    with:
      fail-on-severity: low
