# Temporary branch-only integration test. Remove before merging the library PR.
name: GHAS - Composite variables test

on:
  push:
    branches: [feature/ghas-toolkit]
    paths:
      - .github/workflows/ghas-composite-preview-test.yml

permissions:
  contents: read

concurrency:
  group: ghas-prepare-MCN-CQEN/ceai-cqen-labinfra-cluster-ghas
  cancel-in-progress: false

jobs:
  configure:
    if: ${{ github.repository == 'MCN-CQEN/ceai-cqen-scripts-lib' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # v2 has no permission-variables input. This token inherits the App
      # installation permissions but remains scoped to this single test fork.
      - name: Create variable management token for the cluster test fork
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GHAS_APP_ID }}
          private-key: ${{ secrets.GHAS_APP_PRIVATE_KEY }}
          owner: MCN-CQEN
          repositories: ceai-cqen-labinfra-cluster-ghas

      - name: Configure scan variables without activation or file installation
        uses: MCN-CQEN/ceai-cqen-scripts-lib/actions/ghas-prepare-fork@8c108cedf0faa03e3ff6cf153ef1b62484a6d8c7
        with:
          target-repository: MCN-CQEN/ceai-cqen-labinfra-cluster-ghas
          library-repository: MCN-CQEN/ceai-cqen-scripts-lib
          library-sha: 8c108cedf0faa03e3ff6cf153ef1b62484a6d8c7
          github-token: ${{ steps.app-token.outputs.token }}
          enable-security: 'false'
          configure-variables: 'true'
          files-mode: none
