# Compatibility adapter. New callers should use actions/ghas-codeql in their own jobs.
name: Reusable GHAS - CodeQL
on:
  workflow_call:
    inputs:
      languages:
        description: JSON array of interpreted CodeQL languages.
        required: true
        type: string
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      # Transitional ref: pin to the migration commit after publishing and testing.
      - uses: MCN-CQEN/ceai-cqen-scripts-lib/actions/ghas-codeql@feature/ghas-toolkit
        with:
          language: ${{ matrix.language }}
